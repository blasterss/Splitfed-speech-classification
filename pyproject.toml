[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "secureasr"
version = "0.0.1"
description = "Research prototype for SplitFed binary classification of emotional speech"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Trubnikov Anatoly", email = "anatolijtrubnikov@yandex.ru" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "librosa>=0.10.2,<0.12",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pydantic>=2.11,<3",
    "PyYAML>=6.0.2,<7",
    "scikit-learn>=1.4,<2",
    "seaborn>=0.13.2,<0.14",
    "sounddevice>=0.5,<1",
    "tqdm>=4.66,<5",
]

[project.scripts]
secureasr = "src.main:main"

# PyTorch is optional in package metadata because its wheel must be selected for
# the host CUDA configuration. See README.md before installing this extra.
[project.optional-dependencies]
train = ["torch==2.4.1"]
dev = [
    "black>=24.0,<26",
    "mypy>=1.10,<2",
    "pytest>=8,<9",
    "pytest-timeout>=2.3,<3",
    "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 79
target-version = ["py310"]
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
