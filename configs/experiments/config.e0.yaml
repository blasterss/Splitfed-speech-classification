# E0 dataset-only analysis. Sampling and metric settings belong to the runner.
datasets:
  - &base_dataset
    name: CREMA-D
    root: ../datasets/CREMA-D/raw
    target_sample_rate: 8000
    feature_names: [mfcc, rms, zcr]
    reduced: false
  - <<: *base_dataset
    name: RAVDESS
    root: ../datasets/RAVDESS/raw
  - <<: *base_dataset
    name: SAVEE
    root: ../datasets/SAVEE/raw
