data_path: ../datasets
models_save_path: artifacts

experiment:
  name: e0_cross_corpus_heterogeneity
  analysis_only: true
  description: >-
    Диагностика естественной неоднородности корпусов CREMA-D, RAVDESS и
    SAVEE. Используются только конфигурации клиентских наборов данных;
    обучение и оценка целевой модели не выполняются.
  transport: queue
  seed: &seed 42

training:
  mode: centralized
  num_rounds: 30
  seed: *seed
  eval_every: 10
  fed_every: 10
  barrier_timeout_sec: 900

clients:
  - client_id: 0
    dataset: &base_dataset
      target_sample_rate: 8000
      feature_names: [mfcc, rms, zcr]
      name: CREMA-D
      root: ../datasets/CREMA-D/raw
      reduced: false
      reduced_size: 480
      test_size: 0.2
      split_seed: *seed
    model: &client_model
      lr: 0.001
      optimizer: adam
    runtime: &client_runtime
      local_steps: 64
      batch_size: 8
      seed: *seed
      device: cpu
    noise: &client_noise
      type: gauss
      std: 1.0e-10

  - client_id: 1
    dataset:
      <<: *base_dataset
      name: RAVDESS
      root: ../datasets/RAVDESS/raw
    model: *client_model
    runtime: *client_runtime
    noise: *client_noise

  - client_id: 2
    dataset:
      <<: *base_dataset
      name: SAVEE
      root: ../datasets/SAVEE/raw
    model: *client_model
    runtime: *client_runtime
    noise: *client_noise

channels: {}
